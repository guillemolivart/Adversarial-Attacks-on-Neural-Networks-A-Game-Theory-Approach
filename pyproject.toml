[project]
name = "adversarial-attacks-on-neural-networks-a-game-theory-approach"
version = "0.1.0"
description = "TFG: Adversarial Attacks with Game Theory"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.0",
    "numpy>=2.1.0",
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "torchaudio>=2.5.1",
    "tqdm>=4.67.1",
]

[tool.uv]
# Això obliga a uv a buscar aquests paquets a l'índex de NVIDIA
sources = { torch = { index = "pytorch-cu121" }, torchvision = { index = "pytorch-cu121" }, torchaudio = { index = "pytorch-cu121" } }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.workspace]
members = ["."]
